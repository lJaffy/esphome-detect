# Sample: object_detect custom component on ESP32-S3 + ESP-IDF.
# Copy the object_detect/ directory next to your YAML and reference it via
# external_components (local path), then adjust the camera pins to your board.

external_components:
  - source:
      type: local
      path: object_detect_parent_dir  # dir containing object_detect/

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    # If the build host is short on RAM, the compiler can be OOM-killed
    # ("fatal error: Killed signal terminated program as") on heavy esp-dl
    # translation units. Building everything at -Os instead of -O3 cuts
    # compiler memory use several-fold. Uncomment if you hit that failure.
    # sdkconfig_options:
    #   CONFIG_COMPILER_OPTIMIZATION_SIZE: y

psram:

esp32_camera:
  id: s3_cam
  # Adjust all pins to your board (example values below are placeholders).
  data_pins: [15, 17, 18, 16, 14, 12, 11, 48]
  vsync_pin: 38
  href_pin: 47
  pixel_clock_pin: 13
  external_clock:
    pin: 10
    frequency: 20MHz
  i2c_pins:
    sda: 40
    scl: 39
  resolution: 320X240
  pixel_format: RGB565  # JPEG also works (smaller stream payloads)
  # max_framerate: 5fps  # uncomment + lower if HA logs API 'Buffer full, ping queued'
  frame_buffer_count: 2  # required: share frames between stream and detection
  frame_buffer_location: PSRAM  # required: models + conversion buffers live in PSRAM

object_detect:
  id: detect
  camera_id: s3_cam
  # object_type: face | pedestrian | cat | dog (default face).
  # Valid models per type:
  #   face:       msrmnp | espdet_224 | espdet_416
  #   pedestrian: pico
  #   cat | dog:  espdet_224 | espdet_416
  object_type: pedestrian
  # model: pico  # default per type; shown explicitly for clarity
  confidence_threshold: 0.5
  throttle: 500ms
  max_boxes: 1
  on_detection:
    - logger.log:
        format: "object x=%.0f y=%.0f w=%.0f h=%.0f score=%.2f count=%d"
        args: [x, y, w, h, score, count]

binary_sensor:
  - platform: object_detect
    object_detect_id: detect
    presence:
      name: Object present

sensor:
  - platform: object_detect
    object_detect_id: detect
    box_x:
      name: Object box X
    box_y:
      name: Object box Y
    box_w:
      name: Object box width
    box_h:
      name: Object box height
    score:
      name: Object score
    count:
      name: Object count

text_sensor:
  - platform: object_detect
    object_detect_id: detect
    model:
      name: Detection model
