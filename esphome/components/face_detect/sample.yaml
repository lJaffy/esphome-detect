# Sample: face_detect custom component on ESP32-S3 + ESP-IDF.
# Copy the face_detect/ directory next to your YAML and reference it via
# external_components (local path), then adjust the camera pins to your board.

external_components:
  - source:
      type: local
      path: face_detect_parent_dir  # dir containing face_detect/

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:

esp32_camera:
  id: s3_cam
  # Adjust all pins to your board (example values below are placeholders).
  data_pins: [15, 17, 18, 16, 14, 12, 11, 48]
  vsync_pin: 38
  href_pin: 47
  pixel_clock_pin: 13
  external_clock:
    pin: 10
    frequency: 20MHz
  i2c_pins:
    sda: 40
    scl: 39
  resolution: 320X240
  pixel_format: RGB565  # required: inference runs on RGB565 frames
  frame_buffer_count: 2  # required: share frames between stream and detection
  frame_buffer_location: PSRAM

face_detect:
  id: face
  camera_id: s3_cam
  confidence_threshold: 0.5
  throttle: 500ms
  max_boxes: 1
  on_face:
    - logger.log:
        format: "face x=%.0f y=%.0f w=%.0f h=%.0f score=%.2f count=%d"
        args: [x, y, w, h, score, count]

binary_sensor:
  - platform: face_detect
    face_detect_id: face
    presence:
      name: Face present

sensor:
  - platform: face_detect
    face_detect_id: face
    box_x:
      name: Face box X
    box_y:
      name: Face box Y
    box_w:
      name: Face box width
    box_h:
      name: Face box height
    score:
      name: Face score
    count:
      name: Face count
